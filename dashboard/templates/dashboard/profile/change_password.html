{% extends 'dashboard/base.html' %}{% block title %}تغيير كلمة المرور{% endblock %}{% block page_title %}تغيير كلمة المرور{% endblock %}
{% block content %}
<div class="max-w-md mx-auto"><div class="bg-white rounded-2xl p-8 card-shadow">
<form method="post" class="space-y-6">{% csrf_token %}
<div><label class="block text-gray-700 font-semibold mb-2">كلمة المرور الحالية</label><input type="password" name="old_password" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-primary"></div>
<div><label class="block text-gray-700 font-semibold mb-2">كلمة المرور الجديدة</label><input type="password" name="new_password" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-primary"></div>
<div><label class="block text-gray-700 font-semibold mb-2">تأكيد كلمة المرور</label><input type="password" name="new_password_confirm" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-primary"></div>
<div class="flex gap-3 pt-4"><button type="submit" class="btn-primary text-white px-8 py-3 rounded-xl font-bold">تغيير</button><a href="{% url 'dashboard:profile' %}" class="px-8 py-3 border border-gray-200 rounded-xl font-bold text-gray-600 hover:bg-gray-50">إلغاء</a></div>
</form>
</div></div>
{% endblock %}
